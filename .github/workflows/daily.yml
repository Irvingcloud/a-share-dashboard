name: 每日A股快照

on:
  schedule:
    # 北京时间 16:10（UTC 08:10），A股收盘后；GitHub 定时可能有几分钟延迟
    - cron: "10 8 * * 1-5"
  workflow_dispatch: {}   # 也可以在网页上手动点一次

permissions:
  contents: write        # 允许 workflow 自己提交 history.csv

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 抓取并写入仓库里的 history.csv
        env:
          HISTORY_BACKEND: github
          MSA_NO_SHUTDOWN: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_HIST_PATH: history.csv
        run: python daily_snapshot.py

      - name: 把日志留成产物（排查用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-log
          path: 日志/
          if-no-files-found: ignore
          retention-days: 20
